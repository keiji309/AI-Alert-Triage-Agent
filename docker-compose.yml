services:
  triage:
    build: .
    image: triage-console:latest
    container_name: triage-console
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/stats', timeout=3)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s